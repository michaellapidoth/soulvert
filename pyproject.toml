[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulvert"
version = "0.1.0"
description = "Download albums from Soulseek, if necessary convert downloaded albums to .alac and import them into Music.app."
authors = [{ name = "Michael", email = "michael.morris.lapidoth@gmail.com" }]
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
  "click>=8.1",
  "rich>=13.7"
]

[project.scripts]
soulvert = "soulvert.cli:cli"

[tool.setuptools]
packages = ["soulvert"]

[tool.setuptools.package-data]
"*" = ["scripts/*.sh"]